<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FitBuddy | Error
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<main class="center-page">

    <section class="card error-card">

        <p class="eyebrow">
            SOMETHING NEEDS ATTENTION
        </p>

        <h1>
            FitBuddy could not complete
            that request.
        </h1>

        <p>
            {{ message }}
        </p>

        <a
            class="primary inline"
            href="/"
        >
            Return to FitBuddy
        </a>

    </section>

</main>

</body>

</html>
